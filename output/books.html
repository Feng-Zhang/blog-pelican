    <script>
        (function () {
            function setupTocFollow() {
                var tocNav = document.querySelector('.table-of-content nav');
                var tocCol = document.querySelector('.table-of-content');
                if (!tocNav || !tocCol) {
                    return;
                }

                var desktop = window.innerWidth > 979;
                if (!desktop) {
                    tocNav.classList.remove('toc-follow-fixed');
                    tocNav.style.width = '';
                    tocNav.style.left = '';
                    return;
                }

                var topOffset = 72;
                var navStartY = tocCol.getBoundingClientRect().top + window.pageYOffset;

                function updateFixedState() {
                    var shouldFix = window.pageYOffset >= (navStartY - topOffset);
                    if (shouldFix) {
                        var rect = tocCol.getBoundingClientRect();
                        tocNav.classList.add('toc-follow-fixed');
                        tocNav.style.left = rect.left + 'px';
                        tocNav.style.width = rect.width + 'px';
                    } else {
                        tocNav.classList.remove('toc-follow-fixed');
                        tocNav.style.left = '';
                        tocNav.style.width = '';
                    }
                }

                updateFixedState();
                window.addEventListener('scroll', updateFixedState, { passive: true });
                window.addEventListener('resize', function () {
                    tocNav.classList.remove('toc-follow-fixed');
                    tocNav.style.left = '';
                    tocNav.style.width = '';
                    setupTocFollow();
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setupTocFollow);
            } else {
                setupTocFollow();
            }
        })();
    </script>
    <script>
    (function () {
        if (window.location.hash.match(/^#comment-\d+$/)) {
            $('#comment_thread').collapse('show');
        }
    })();
    window.onhashchange=function(){
        if (window.location.hash.match(/^#comment-\d+$/))
            window.location.reload(true);
    }
    $('#comment_thread').on('shown', function () {
        var link = document.getElementById('comment-accordion-toggle');
        var old_innerHTML = link.innerHTML;
        $(link).fadeOut(200, function() {
            $(this).text('Click here to hide comments').fadeIn(200);
        });
        $('#comment_thread').on('hidden', function () {
            $(link).fadeOut(200, function() {
                $(this).text(old_innerHTML).fadeIn(200);
            });
        })
    })
</script>
